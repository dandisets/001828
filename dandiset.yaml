description: Progressive degeneration of dopamine neurons (DANs) defines Parkinson’s
  disease (PD). However, the identity and function of the most vulnerable DAN populations
  in prodromal PD remain undefined. Here, we identify substantia nigra DANs with Annexin
  A1 (Anxa1) expression as selectively vulnerable across multiple prodromal PD models
  and in PD patient samples. We found that Anxa1+ DANs have a unique functional profile,
  as they do not signal reward or reinforce actions, and they are not necessary for
  motivated behavior. Instead, activity of Anxa1+ DAN axons correlates with vigorous
  movements during self-paced exploration, yet their silencing only disrupts a subset
  of action sequences that mirror a bradykinesia profile. Importantly, Anxa1+ DANs
  are necessary for procedural learning in a maze task and for improving dexterous
  motor actions. These findings establish the early vulnerability of Anxa1+ DANs in
  PD, whose function can explain prodromal PD bradykinesia and impairments in procedural
  motor learning.
